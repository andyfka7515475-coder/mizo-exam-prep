 {"id":"MCS21-P1-021","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The early leadership of the Indian National Congress was ___________ in its methods and aims.","optionA":"Extreme","optionB":"Moderate","optionC":"Nationalist","optionD":"Colonialist","correctAnswer":"B","subject":"History & National Movement","topic":"Moderates","difficulty":"Easy","explanationEnglish":"The early Congress leadership is identified with the Moderates, who generally preferred constitutional and gradual methods.","explanationMizo":"Indian National Congress (INC) hruaitu hmasate kha 'Moderates' tih an ni. Anni hian dan kalphung leh constitutional method hmanga ram siamthat leh political reform neihpui kha an thil tum ber a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-022","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The revolutionary organization ‘Abhinav Bharat Society’ was founded in 1904 by –","optionA":"Bhagat Singh","optionB":"Vinayak Damodar Savarkar","optionC":"Barindra Kumar Ghosh","optionD":"Pulin Behari Das","correctAnswer":"B","subject":"History & National Movement","topic":"Revolutionary Movement","difficulty":"Easy","explanationEnglish":"Abhinav Bharat Society was founded in 1904 by Vinayak Damodar Savarkar and his associates.","explanationMizo":"Abhinav Bharat Society hi kum 1904 khan Vinayak Damodar Savarkar leh a unaupa Ganesh Savarkar-a ten an din a, British sawrkar laka helna (revolutionary movement) kalpuitu paw pawimawh tak a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-023","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"She is remembered for organizing the Congress Radio, also called the Secret Congress Radio, an\nunderground radio station, which functioned for few months during the Quit India Movement of 1942.","optionA":"Kamaladevi Chattopadhyay","optionB":"Aruna Asaf Ali","optionC":"Usha Mehta","optionD":"Matangini Hazra","correctAnswer":"C","subject":"History & National Movement","topic":"Quit India Movement","difficulty":"Easy","explanationEnglish":"Usha Mehta is associated with the underground Congress Radio during the Quit India Movement of 1942.","explanationMizo":"Kum 1942 Quit India Movement lai khan Usha Mehta hian thuruk a puanzar thin 'Congress Radio' (Secret Congress Radio) a kalpui a. British sawrkarin chanchinbu a khap hnan (censorship) hnuah he radio hmang hian mipuite hnenah chanchin dik a puangzar thin.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-024","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Gandhi founded the Sabarmati Ashram in ___________ in May 1915, where he hoped to create,\namong ‘a religious community on the traditional Hindu pattern’, an environment conducive to the ‘spiritual\ndeliverance’ of his homeland.","optionA":"Madras","optionB":"Benares","optionC":"Calcutta","optionD":"Ahmedabad","correctAnswer":"D","subject":"History & National Movement","topic":"Gandhian Era","difficulty":"Easy","explanationEnglish":"Gandhi established the Sabarmati Ashram at Ahmedabad in 1915.","explanationMizo":"Mahatma Gandhi chuan South Africa atanga a lo haw hnu, kum 1915 May khan Gujarat-a Ahmedabad khaw bulah Sabarmati Ashram a din a.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-025","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Communist Party of India(CPI) was formed at Kanpur on –","optionA":"January 1923","optionB":"March 1924","optionC":"October 1925","optionD":"December 1925","correctAnswer":"D","subject":"History & National Movement","topic":"Communist Movement","difficulty":"Easy","explanationEnglish":"The CPI was formed at Kanpur in December 1925.","explanationMizo":"Communist Party of India (CPI) hi kum 1925 December thlaa Kanpur khawpuia an inkhawmpui neihah din tan a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-026","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Gandhi began his historic Salt March, the Dandi March, from Sabarmati to the sea-side village of\nDandi on –","optionA":"1 March 1929","optionB":"12 March 1930","optionC":"12 March 1931","optionD":"5 March 1932","correctAnswer":"B","subject":"History & National Movement","topic":"Civil Disobedience Movement","difficulty":"Easy","explanationEnglish":"The Dandi March began from Sabarmati on 12 March 1930.","explanationMizo":"Mahatma Gandhi chuan British sawrkarin chi (salt) chhiah a chawi tir chu dodalin, 12 March 1930 khan Sabarmati Ashram atangin Dandi tuipui kam panin 'Salt March' (Dandi March) a tan a; hei hi Civil Disobedience Movement intanna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-027","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The idea of the Indian National Army (INA) was first conceived in Malaya by –","optionA":"Lala Lajpat Rai","optionB":"Subhas Chandra Bose","optionC":"Bhagat Singh","optionD":"Mohan Singh","correctAnswer":"D","subject":"History & National Movement","topic":"Indian National Army","difficulty":"Easy","explanationEnglish":"The initial idea of the INA is associated with Mohan Singh in Malaya.","explanationMizo":"Indian National Army (INA) din tura rawtna leh ngaihtuahna hmasa ber petu chu Malaya ram laia British-Indian Army captain Mohan Singh a ni. A hnuah Subhas Chandra Bose chuan rawn zawmin a kaihhruai chhunzawm a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-028","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"A dry, cool and dusty northeasterly wind in West Africa, which occurs in between the end of November\nand the middle of March is known as –","optionA":"Karaburun","optionB":"Elephanta","optionC":"Sirocco","optionD":"Harmattan","correctAnswer":"D","subject":"Geography","topic":"Climatology","difficulty":"Easy","explanationEnglish":"Harmattan is the dry, cool and dusty northeasterly wind of West Africa during the stated season.","explanationMizo":"West Africa vela November tawp atanga March thla inkar thlentu, Sahara thlaler atanga vut leh khu pu chhuaka thli ro leh vawt tak tleh thin chu 'Harmattan' tih a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-029","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Match List – I with List – II and select the correct answer from the codes given below –\nList – I (Pass) List – II (State)\nA. Shipki La 1. Arunachal Pradesh\nB. Niti Pass 2. Himachal Pradesh\nC. Nathu La 3. Uttarakhand\nD. Bomdi La 4. Sikkim\nCodes  : A B C D","optionA":"2 3 4 1","optionB":"2 3 1 4","optionC":"4 2 1 3","optionD":"4 2 3 1","correctAnswer":"A","subject":"Geography","topic":"Mountain Passes","difficulty":"Medium","explanationEnglish":"Shipki La is in Himachal Pradesh, Niti Pass in Uttarakhand, Nathu La in Sikkim and Bomdi La in Arunachal Pradesh.","explanationMizo":"Mountain pass leh an awmna state-te chu:\nShipki La — Himachal Pradesh\nNiti Pass — Uttarakhand\nNathu La — Sikkim\nBomdi La — Arunachal Pradesh\nChuvangin, a indawt dan dik chu A (2, 3, 4, 1) a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-030","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which one of the following rivers does not flow through Himachal Pradesh?","optionA":"Jhelum","optionB":"Beas","optionC":"Chenab","optionD":"Ravi","correctAnswer":"A","subject":"Geography","topic":"Rivers of India","difficulty":"Easy","explanationEnglish":"The Jhelum does not flow through Himachal Pradesh; the Beas, Chenab and Ravi do.","explanationMizo":"Jhelum lui hi Himachal Pradesh-ah a luang ve lo va, Jammu & Kashmir leh Pakistan lamah a luang zawk a ni. Beas, Chenab, leh Ravi erawh Himachal Pradesh-ah an luang tlang thung.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-031","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Tummalapalle Uranium Mine is located in –","optionA":"Chhattisgarh","optionB":"Tamil Nadu","optionC":"Odisha","optionD":"Andhra Pradesh","correctAnswer":"D","subject":"Geography","topic":"Mineral Resources","difficulty":"Easy","explanationEnglish":"The Tummalapalle Uranium Mine is located in Andhra Pradesh.","explanationMizo":"Tummalapalle Uranium Mine hi Andhra Pradesh state-a Kadapa (YSR) district-ah a awm a; India rama uranium laihchhuahna hmunpui berte zinga mi a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-032","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Choose the correct statement(s) –\n1. The mantle starts from Moho discontinuity.\n2. The discontinuity between upper crust and lower crust is called Conrad discontinuity.\n3. The mantle is mostly in liquid state.\nSelect the correct answer from the following codes.","optionA":"Only 1","optionB":"Only 1 and 2","optionC":"Only 2 and 3","optionD":"1, 2 and 3","correctAnswer":"B","subject":"Geography","topic":"Earth Structure","difficulty":"Medium","explanationEnglish":"The mantle begins below the Mohorovičić (Moho) discontinuity, and the Conrad discontinuity separates upper and lower crustal layers; the mantle is not mostly liquid.","explanationMizo":"Earth mantle hi Moho discontinuity atangin a intan a, tin upper crust leh lower crust inrina chu Conrad discontinuity a ni bawk. Mantle hi tui (liquid) vek ni lovin solid/semi-solid rock a nih avangin statement 3-na a dik lo va, Only 1 and 2 a dik ber.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-033","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Rouf is a folk dance of Muslim Communities in –","optionA":"Himachal Pradesh","optionB":"Assam","optionC":"Kashmir","optionD":"Uttarakhand","correctAnswer":"C","subject":"Geography","topic":"Indian Folk Dances","difficulty":"Easy","explanationEnglish":"Rouf is a traditional folk dance associated with Kashmir.","explanationMizo":"Rouf (Roff) hi Jammu & Kashmir-a hmeichhiaten Eid leh favang lai kuta an lam thin, an hnam lam (folk dance) langsar tak a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-034","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Arrange the following mountain ranges of India from North to South –\nI. Aravalli Range II. Satpura Range\nIII. Vindhyan Range IV. Ajanta Range\nChoose the correct option from the codes given below –","optionA":"I, IV, II, III","optionB":"I, II, IV , III","optionC":"I, III, II, IV","optionD":"I, III, IV , II","correctAnswer":"C","subject":"Geography","topic":"Mountain Ranges","difficulty":"Medium","explanationEnglish":"From north to south among the listed ranges: Aravalli, Vindhyan, Satpura, then Ajanta.","explanationMizo":"North (Hmar) atanga South (Chhim) lama tlangdung indawt dan dik chu: Aravalli → Vindhyan → Ajanta → Satpura a ni. Chuvangin, chhanna dik chu D (I, III, IV, II) a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-035","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The eastern hills of the Himalayas covering the N.E. India are known by the name –","optionA":"the Purvanchal","optionB":"the Pir Panjal","optionC":"the Himadri","optionD":"the Shiwalik","correctAnswer":"A","subject":"Geography","topic":"Purvanchal","difficulty":"Easy","explanationEnglish":"The eastern Himalayan hills across Northeast India are known as the Purvanchal.","explanationMizo":"Northeast India-a Himalaya chhim-chhak lam tlangdung kal zelte chu 'Purvanchal' tih a ni a. Hemi chhungah hian Patkai, Naga, Manipur, leh Mizo (Lushai) Hills te an tel.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-036","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which among the following hills is not found in the northern part of the Indian Peninsular plateau?","optionA":"The Satpura Range","optionB":"The Maikal Range","optionC":"The Rajmahal Hills","optionD":"The Nilgiri Hills","correctAnswer":"D","subject":"Geography","topic":"Peninsular Plateau","difficulty":"Medium","explanationEnglish":"The Nilgiri Hills are not in the northern part of the Indian Peninsular Plateau.","explanationMizo":"Nilgiri Range hi Peninsular India chhim tawp (Tamil Nadu, Kerala, leh Karnataka inrina) lama awm a ni a; Northern Peninsular region-ah a tel ve lo. Satpura, Maikal, leh Rajmahal Hills-te erawh hmarchhak leh hmar lam peninsular tlang dung an ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-037","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Ox-bow lakes are formed due to –","optionA":"Flooding","optionB":"Intense meandering","optionC":"Headward erosion","optionD":"Wave erosion","correctAnswer":"B","subject":"Geography","topic":"River Landforms","difficulty":"Easy","explanationEnglish":"Ox-bow lakes develop from intense meandering when a river bend becomes cut off.","explanationMizo":"Lui a puih (meander) vak changin a kual lai chu a hnuah a inping dang a, luikawng thar a zawh thin. Luikual hlamchhiah tak khan 'Ox-bow lake' (bawngki ang dika kual dil) a siam phah thin.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-038","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following country shares international border with Myanmar?","optionA":"Indonesia","optionB":"Cambodia","optionC":"Vietnam","optionD":"Laos","correctAnswer":"D","subject":"Geography","topic":"International Borders","difficulty":"Easy","explanationEnglish":"Laos shares an international land border with Myanmar.","explanationMizo":"Myanmar hian ramri inrihna neihte chu: India, Bangladesh, China, Thailand, leh Laos te an ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-039","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Forest Survey of India (FSI) defines forest cover as an area more than one hectares in extent, with\ntree canopy having a density of –","optionA":"More than 10%","optionB":"More than 5%","optionC":"More than 25%","optionD":"More than 35%","correctAnswer":"A","subject":"Geography","topic":"Forest Cover","difficulty":"Medium","explanationEnglish":"FSI forest cover uses a minimum tree-canopy density threshold of more than 10 percent for areas meeting the definition.","explanationMizo":"Forest Survey of India (FSI) teh dan chuan, ram ngaw (forest cover) tiha chhiar tur chuan hmunhma hectare 1 aia zau a nih bakah, thing hnah inkhuh (tree canopy density) chu 10% aia tam a ni tur a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-040","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Ordinance can be promulgated by –","optionA":"Lok Sabha","optionB":"President of India","optionC":"Lok Sabha and Rajya Sabha","optionD":"Prime Minister","correctAnswer":"B","subject":"Indian Polity","topic":"Ordinance","difficulty":"Easy","explanationEnglish":"An ordinance at the Union level is promulgated by the President of India when the constitutional conditions are met.","explanationMizo":"Parliament-in session an neih loh laia dan hmanmawhthlak tak siam a ngaihin, President of India chuan Constitution Article 123 tlawhchhanin 'Ordinance' a tichhuak thei.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-041","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following Rights are available to foreigners living in India?\ni) Equality before law ii) Right to elementary education\niii) Freedom of speech iv) Freedom of movement\nSelect the correct answer from the codes given below –","optionA":"ii only","optionB":"i & ii","optionC":"ii & iv","optionD":"i, ii & iii","correctAnswer":"B","subject":"Indian Polity","topic":"Fundamental Rights","difficulty":"Medium","explanationEnglish":"Foreigners in India are protected by equality before law under Article 14 and can receive other rights according to their applicability; the keyed combination is B.","explanationMizo":"He zawhna-a statement-te zinga i, ii leh iii te hi foreigner-te hnenah pawh awm thei tura dah an ni. Chuvangin chhanna dik chu D (i, ii & iii) a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-042","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the given Amendment in the Indian Constitution led to the beginning of Panchayat Raj in India?","optionA":"73rd Constitutional Amendment Act","optionB":"64th Constitutional Amendment Act","optionC":"62nd Constitutional Amendment Act","optionD":"69th Constitutional Amendment Act","correctAnswer":"A","subject":"Indian Polity","topic":"Panchayati Raj","difficulty":"Easy","explanationEnglish":"The 73rd Constitutional Amendment gave constitutional status to Panchayati Raj institutions.","explanationMizo":"73rd Constitutional Amendment Act, 1992 hmang hian Panchayati Raj institutions (rural local self-government)-te chu Constitution-ah telh niin dinhmun nghet pek an ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-043","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The funds which are made available by the Parliament to meet the expenses during the period between\nthe presentation of the Budget and its final approval is known as –","optionA":"V ote on Account","optionB":"Interim Budget","optionC":"Preliminary Budget","optionD":"Gender Budget","correctAnswer":"A","subject":"Indian Polity","topic":"Parliamentary Financial Procedure","difficulty":"Easy","explanationEnglish":"A Vote on Account provides funds to meet government expenditure for the interim period before the full Budget is approved.","explanationMizo":"Kum thar Budget an la passed hmahlawka sawrkar sum hman tur leh hnathawh chhunzawm nan Parliament-in sum hman a phalsak lailawk hi 'Vote on Account' tih a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-044","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following Rights was described by Dr. Ambedkar as, “the heart and soul of the Constitution”?","optionA":"Right to Equality","optionB":"Right to Freedom","optionC":"Right to Constitutional Remedies","optionD":"Right to Freedom of Religion","correctAnswer":"C","subject":"Indian Polity","topic":"Fundamental Rights","difficulty":"Easy","explanationEnglish":"Dr. B. R. Ambedkar described the Right to Constitutional Remedies as the heart and soul of the Constitution.","explanationMizo":"Dr. B. R. Ambedkar chuan Article 32 (Right to Constitutional Remedies) hi kan Fundamental Rights palzut a nih laia Supreme Court thlenga thlen theihna a nih avangin Constitution-a \"lungphu leh thlarau\" (Heart and Soul) a ti a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-045","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following is enforceable in a Court of Law?","optionA":"Fundamental Duties","optionB":"Fundamental Rights","optionC":"Directive Principles","optionD":"Preamble","correctAnswer":"B","subject":"Indian Polity","topic":"Fundamental Rights","difficulty":"Easy","explanationEnglish":"Fundamental Rights are enforceable through the courts.","explanationMizo":"Fundamental Rights chauh hi court hmanga khing let theih (justiciable/enforceable) a ni a. Directive Principles (DPSP) leh Fundamental Duties-te erawh court hmanga nawr luih (enforce) theih an ni lo.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-046","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which Article of the Indian Constitution deals with the imposition of the President’s rule?","optionA":"Article 344","optionB":"Article 356","optionC":"Article 375","optionD":"Article 344","correctAnswer":"B","subject":"Indian Polity","topic":"President’s Rule","difficulty":"Easy","explanationEnglish":"Article 356 provides for President’s Rule in a state when the constitutional conditions are satisfied.","explanationMizo":"State pakhatah Constitution kalhmang anga sawrkar a kal theih lohva tlukchhiatna a thlenin, Article 356 tlawhchhanin President's Rule (State Emergency) puan theih a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-047","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"In India, Local Government is a subject of –","optionA":"Union list","optionB":"State list","optionC":"Concurrent list","optionD":"Residuary subject","correctAnswer":"B","subject":"Indian Polity","topic":"Seventh Schedule","difficulty":"Easy","explanationEnglish":"Local government is placed in the State List, subject to the constitutional framework for local bodies.","explanationMizo":"Constitution Seventh Schedule-ah hian Local Government (Panchayat leh Municipality) hi State List hnuaia dah a ni a; state sawrkar mawhphurhna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-048","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"At what level does a Panchayat Samiti operate in a Panchayati Raj structure?","optionA":"Village level","optionB":"Gram Panchayat level","optionC":"Block level","optionD":"District level","correctAnswer":"C","subject":"Indian Polity","topic":"Panchayati Raj","difficulty":"Easy","explanationEnglish":"A Panchayat Samiti operates at the block/intermediate level.","explanationMizo":"Panchayati Raj inrelbawlna peng pathum zinga Panchayat Samiti hi Block level-a mi a ni. Gram Panchayat chu khua (village) level a ni a, Zila Parishad chu District level a ni thung.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-049","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which State Assembly has the highest number of MLA in India?","optionA":"Uttar Pradesh","optionB":"Maharashtra","optionC":"West Bengal","optionD":"Andhra Pradesh","correctAnswer":"A","subject":"Indian Polity","topic":"State Legislatures","difficulty":"Easy","explanationEnglish":"Uttar Pradesh has the largest State Legislative Assembly by number of MLAs.","explanationMizo":"India ram puma Legislative Assembly-ah chuan Uttar Pradesh Legislative Assembly hi MLA seat tam ber (seat 403) nei an ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-050","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Members of the State Public Service Commission are appointed by –","optionA":"President","optionB":"Chief Justice","optionC":"Chief Minister of the State","optionD":"Governor of the State","correctAnswer":"D","subject":"Indian Polity","topic":"State Public Service Commission","difficulty":"Easy","explanationEnglish":"Members of a State Public Service Commission are appointed by the Governor of the state.","explanationMizo":"State Public Service Commission (MPSC angte) Chairman leh Member-te hi Governor-in a ruat (appoint) thin.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-051","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Economic Survey in India is compiled every year by Department of Economic Affairs and published by\nthe –","optionA":"NITI Aayog","optionB":"Reserve Bank of India","optionC":"Ministry of Industries","optionD":"Ministry of Finance","correctAnswer":"D","subject":"Economy & Social Development","topic":"Economic Survey","difficulty":"Medium","explanationEnglish":"The Economic Survey is published by the Ministry of Finance, Department of Economic Affairs.","explanationMizo":"India rama kum tin chhuak 'Economic Survey' hi Department of Economic Affairs buatsaih a ni a, Ministry of Finance hmingin Parliament-ah pharh a ni thin.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-052","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Universal Declaration of Human Rights was adopted on –","optionA":"December 1, 1948","optionB":"December 10, 1948","optionC":"December 11, 1948","optionD":"December 30, 1948","correctAnswer":"B","subject":"Economy & Social Development","topic":"Human Rights","difficulty":"Easy","explanationEnglish":"The Universal Declaration of Human Rights was adopted by the UN General Assembly on 10 December 1948.","explanationMizo":"Universal Declaration of Human Rights (UDHR) hi 10 December 1948 khan UN General Assembly chuan a pawm a; hemi ni hi kum tin 'Human Rights Day' atan hman a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-053","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Agenda 21 refers to –","optionA":"An agreement between 20 developing countries of the world on climate change","optionB":"A free trade agreement between 7 developed countries of the world","optionC":"A non-binding, voluntarily implemented action plan of the United Nations with regard to sustainable\ndevelopment","optionD":"An agreement of all nations under United Nations with regards to maintaining peace and security","correctAnswer":"C","subject":"Economy & Social Development","topic":"Sustainable Development","difficulty":"Easy","explanationEnglish":"Agenda 21 is a non-binding, voluntarily implemented UN action plan for sustainable development.","explanationMizo":"Agenda 21 hi kum 1992 Rio Earth Summit-a sustainable development tihhmasawnna tura duan UN action plan a ni. He plan hi non-binding leh voluntarily implemented tur a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-054","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"At the central government level, which agency has been assigned the role of overseeing the implementation\nof SDGs in India?","optionA":"Ministry of Statistics & Programme Implementation","optionB":"Ministry of Finance","optionC":"Niti Aayog","optionD":"Ministry of Rural Development","correctAnswer":"C","subject":"Economy & Social Development","topic":"SDGs in India","difficulty":"Easy","explanationEnglish":"NITI Aayog is the central coordinating institution assigned the role of overseeing SDG implementation in India.","explanationMizo":"India ram huapa Sustainable Development Goals (SDGs) hlawhtlinna tur endik leh implementation tihzauh tura central agency pawimawh ber chu NITI Aayog a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-055","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which age group is included to calculate child sex ratio in India?","optionA":"0 – 5 years","optionB":"0 – 6 years","optionC":"1 – 5 years","optionD":"1 – 6 years","correctAnswer":"B","subject":"Economy & Social Development","topic":"Demography","difficulty":"Easy","explanationEnglish":"India’s child sex ratio is calculated for the 0–6 age group.","explanationMizo":"Census teh danah Child Sex Ratio chu naupang kum 0 atanga 6 inkar zinga mipa 1,000 zela hmeichhe awm zat chhutna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-056","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following programmes aim at promoting savings among rural women?","optionA":"Rashtriya Mahila Kosh","optionB":"Mahila Samriddhi Yojana","optionC":"Indira Manila Yojana","optionD":"Jawahar Rozgar Yojana","correctAnswer":"B","subject":"Economy & Social Development","topic":"Women & Rural Development","difficulty":"Easy","explanationEnglish":"Mahila Samriddhi Yojana was aimed at promoting savings among rural women.","explanationMizo":"Mahila Samriddhi Yojana hi thingtlang hmeichhiate, a bikin mi harsa zawkte'n sum khawl nachang an hriat a, bank kalphung an man theih nana sawrkar ruahmanna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-057","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"As one of the most the important inclusive development initiatives taken by the Central government, the\nallocation of funds for MGNREGS for the period of 2021-22 in the Union Budget 2021-22 is –","optionA":"Rs 73,000 crore","optionB":"Rs 71,000 crore","optionC":"Rs 63,500 crore","optionD":"Rs 61,500 crore","correctAnswer":"A","subject":"Economy & Social Development","topic":"MGNREGS","difficulty":"Medium","explanationEnglish":"The Union Budget 2021–22 allocated ₹73,000 crore for MGNREGS.","explanationMizo":"Kum 2021–22 Union Budget khan MGNREGS (in tin inhlawhna) atan cheng vaibelchhe 73,000 (₹73,000 crore) a ruahman a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-058","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The second phase of the Swachh Bharat Mission (Grameen) is to be implemented during which time\nperiod?","optionA":"2020-2021 to 2022-2023","optionB":"2020-2021 to 2023-2024","optionC":"2020-2021 to 2024-2025","optionD":"2020-2021 to 2025-2026","correctAnswer":"C","subject":"Economy & Social Development","topic":"Swachh Bharat Mission","difficulty":"Easy","explanationEnglish":"Swachh Bharat Mission (Grameen) Phase II was scheduled for 2020–21 to 2024–25.","explanationMizo":"Swachh Bharat Mission (Grameen) Phase II hi kum 2020–21 atanga 2023–24 chhung atan ruahman a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-059","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The percentage of population living below poverty line in Mizoram as per BPL Baseline Survey 2016,\nDirectorate of Economics & Statistics Department, Government of Mizoram is –","optionA":"20.22","optionB":"22.22","optionC":"15.63","optionD":"19.63","correctAnswer":"D","subject":"Economy & Social Development","topic":"Poverty in Mizoram","difficulty":"Medium","explanationEnglish":"The keyed figure for Mizoram’s BPL population in the cited 2016 baseline survey is 19.63 percent.","explanationMizo":"BPL Baseline Survey 2016 record angin Mizoram puma mirethei (poverty percentage) zat chu 15.63% a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-060","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following is deducted from GNP to arrive at NNP?","optionA":"Interest","optionB":"Indirect Tax","optionC":"Depreciation","optionD":"Subsidy","correctAnswer":"C","subject":"Economy & Social Development","topic":"National Income","difficulty":"Easy","explanationEnglish":"Depreciation is deducted from GNP to obtain NNP at market prices before other adjustments such as indirect taxes are considered.","explanationMizo":"Gross National Product (GNP) atangin khawl leh hmanraw hlui man/chhe man (Depreciation) paih hian Net National Product (NNP) a chhuak: NNP = GNP – Depreciation.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-061","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following is not included among the criteria adopted by 15th Finance Commission for\nHorizontal Devolution?","optionA":"Population","optionB":"Forest and Ecology","optionC":"Income Distance","optionD":"Index of Infrastructure","correctAnswer":"D","subject":"Economy & Social Development","topic":"Finance Commission","difficulty":"Medium","explanationEnglish":"Index of Infrastructure was not among the criteria listed for the 15th Finance Commission’s horizontal devolution.","explanationMizo":"15th Finance Commission-in state hrang hrangte hnena sum sem dan ruahmanna (horizontal devolution) a siamah Population, Income distance, leh Forest & ecology te an tel a; 'Index of Infrastructure' erawh a tel ve lo.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-062","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which is the correct sequence of expert group on poverty estimation constituted by Planning Commission\nin India?","optionA":"Lakdawala Committee, Alagh Committee, Rangarajan Committee, Tendulkar Committee","optionB":"Alagh Committee, Lakdawala Committee, Tendulkar Committee, Rangarajan Committee","optionC":"Alagh Committee, Tendulkar Committee, Rangarajan Committee, Lakdawala Committee","optionD":"Lakdawala Committee, Tendulkar Committee, Alagh Committee, Rangarajan Committee","correctAnswer":"B","subject":"Economy & Social Development","topic":"Poverty Estimation","difficulty":"Medium","explanationEnglish":"The poverty-estimation expert groups in chronological order are Alagh, Lakdawala, Tendulkar and Rangarajan.","explanationMizo":"Planning Commission-in mirethei zat chhutna atana Expert Committee a din indawt dan chu: Alagh Committee (1979) → Lakdawala Committee (1993) → Tendulkar Committee (2009) → Rangarajan Committee (2014) a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-063","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Pradhan Mantri Jan-Dhan Yojana was launched for –","optionA":"Providing housing loan to poor people at cheaper interest rates","optionB":"Promoting women’s self-help groups in backward areas","optionC":"Promoting financial inclusion in the country","optionD":"Providing financial help to the marginalized communities","correctAnswer":"C","subject":"Economy & Social Development","topic":"Financial Inclusion","difficulty":"Easy","explanationEnglish":"Pradhan Mantri Jan-Dhan Yojana was launched to promote financial inclusion.","explanationMizo":"Pradhan Mantri Jan-Dhan Yojana (PMJDY) hi mi rethei ber thlenga bank account neiha bank service an hman theih nana din a ni a; hei hi 'Financial Inclusion' tihhmasawnna hmanrua pawimawh ber a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-064","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The apex financial institution responsible for the promotion, financing and development of micro, small\nand medium industries in India is –","optionA":"IDBI","optionB":"SIDBI","optionC":"NABARD","optionD":"HUDCO","correctAnswer":"B","subject":"Economy & Social Development","topic":"MSME Finance","difficulty":"Easy","explanationEnglish":"SIDBI is the apex financial institution for promotion, financing and development of the MSME sector.","explanationMizo":"Small Industries Development Bank of India (SIDBI) hi kutdawh/sumdawnna te chi (MSME sector) sum lama puih leh tihhmasawn nana din bik a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-065","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Air (Prevention and Control of Pollution) Act came into force in –","optionA":"1980","optionB":"1981","optionC":"1982","optionD":"1983","correctAnswer":"B","subject":"Environment","topic":"Environmental Law","difficulty":"Easy","explanationEnglish":"The Air (Prevention and Control of Pollution) Act came into force in 1981.","explanationMizo":"Boruk tihbawlhhlawh venna dan 'Air (Prevention and Control of Pollution) Act' hi kum 1981 khan India-ah hman tan a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-066","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which one of the following is the largest ecosystem?","optionA":"Forest ecosystem","optionB":"Marine ecosystem","optionC":"Desert ecosystem","optionD":"Pond ecosystem","correctAnswer":"B","subject":"Environment","topic":"Ecosystems","difficulty":"Easy","explanationEnglish":"The marine ecosystem is the largest ecosystem by area on Earth.","explanationMizo":"Marine ecosystem chu ecosystem hrang hrang zingah area-ah a zau ber a ni. Tuifinriat leh tuipui zawng zawng hi marine ecosystem-ah an tel.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-067","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following is not an in-situ conservation?","optionA":"Biosphere reserve","optionB":"National Parks","optionC":"Zoological Parks","optionD":"Wildlife sanctuary","correctAnswer":"C","subject":"Environment","topic":"Conservation","difficulty":"Easy","explanationEnglish":"Zoological parks are ex-situ conservation facilities rather than in-situ conservation.","explanationMizo":"In-situ conservation chu ramsa leh nungchate an mahni chenna ngaw/hmun ngeia humhalh (National Park, Wildlife Sanctuary angte) a ni a. Ran in (Zoological park/Zoo) erawh hmun danga la chhuaka enkawl an nih avangin Ex-situ conservation an ni thung.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-068","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"How many biogeographical regions is India divided?","optionA":"8","optionB":"10","optionC":"16","optionD":"18","correctAnswer":"B","subject":"Environment","topic":"Biogeography","difficulty":"Medium","explanationEnglish":"India is divided into 10 biogeographical zones/regions in the classification used by the question.","explanationMizo":"Wildlife Institute of India (WII) teh danin India ram hi biogeographical zone hrang hrang 10-ah then a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-069","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Kyoto protocol is an international agreement which deals with the issue of –","optionA":"Green house gases","optionB":"Ozone depleting substances","optionC":"Biological diversity","optionD":"Hazardous chemicals","correctAnswer":"A","subject":"Environment","topic":"Climate Change","difficulty":"Easy","explanationEnglish":"The Kyoto Protocol addresses greenhouse-gas emissions and climate change.","explanationMizo":"Kyoto Protocol hi khawvel lum chho zual zel tur ven nana boruak tihnawmtu gas (greenhouse gases) tihhniam tura ram hrang hrangte inremna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-070","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The first biosphere reserve in India was established in 1986 at –","optionA":"Nilgiri","optionB":"Nanda Devi","optionC":"Rann of Kutch","optionD":"Sunderbans","correctAnswer":"A","subject":"Environment","topic":"Biosphere Reserves","difficulty":"Easy","explanationEnglish":"Nilgiri was India’s first biosphere reserve, established in 1986.","explanationMizo":"India rama Biosphere Reserve hmasa ber chu kum 1986-a din Nilgiri Biosphere Reserve a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-071","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The natural place of an organism or community is known as –","optionA":"Niche","optionB":"Biome","optionC":"Habitat","optionD":"Habit","correctAnswer":"C","subject":"Environment","topic":"Ecology","difficulty":"Easy","explanationEnglish":"The natural place where an organism or community lives is its habitat.","explanationMizo":"Nungcha leh thilnung dangte awmna leh chenna hmun ngei chu 'Habitat' tih a ni. Niche erawh chu nungchaten ecosystem chhunga an chanvo leh hnathawh (role) sawina a ni thung.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-072","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The Pyramid of energy in any ecosystem is –","optionA":"Always upright","optionB":"Always inverted","optionC":"May be upright or inverted","optionD":"None of these","correctAnswer":"A","subject":"Environment","topic":"Ecological Pyramids","difficulty":"Easy","explanationEnglish":"The pyramid of energy is always upright because energy decreases at successive trophic levels.","explanationMizo":"Ecosystem-ah trophic level sang zelah chakna (energy) a tlem tial tial thin avangin Pyramid of Energy hi a ding zawngin (always upright) a awm ziah a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-073","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"According to the India State of Forest Report (ISFR) 2019, in terms of the percentage cover of forests\nin ascending order for Mizoram is –","optionA":"Moderately Dense Forest < Very Dense Forest < Open Forest","optionB":"Open Forest < Very Dense Forest < Moderately Dense Forest","optionC":"Very Dense Forest < Moderately Dense Forest < Open Forest","optionD":"Open Forest < Moderately Dense Forest < Very Dense Forest","correctAnswer":"C","subject":"Environment","topic":"Forest Types","difficulty":"Medium","explanationEnglish":"For Mizoram in ISFR 2019, the percentage cover order asked is Very Dense Forest < Moderately Dense Forest < Open Forest.","explanationMizo":"India State of Forest Report (ISFR) record-ah chuan Mizoram ngaw awm zat hi a tlem ber atanga chhiarin: Very Dense Forest (<) Moderately Dense Forest (<) Open Forest tiin a indawt a; Open Forest hi a tam ber a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-074","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Red data book contains data of –","optionA":"all existing plant and animal species","optionB":"rare and endangered species","optionC":"economically important species","optionD":"extinct species","correctAnswer":"B","subject":"Environment","topic":"Red Data Book","difficulty":"Easy","explanationEnglish":"The Red Data Book records rare and endangered species.","explanationMizo":"IUCN Red Data Book (Red List) hian khawvel puma nungcha leh thingphun mang mai hlauhawma awmte (rare, threatened, leh endangered species) dinhmun a tarlang thin.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-075","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Earth’s temperature is quite stable because we are surrounded by ________ which allows the right\namount of sunlight in to warm the Earth.","optionA":"a cloud layer","optionB":"an atmosphere","optionC":"gravity","optionD":"water","correctAnswer":"B","subject":"Environment","topic":"Atmosphere","difficulty":"Easy","explanationEnglish":"The atmosphere surrounds Earth and allows incoming sunlight while helping regulate temperature.","explanationMizo":"Earth chu atmosphere-in a tuam a. He atmosphere hian sunlight lut tur leh Earth atanga heat chhuak turte a control ve bawk a, chuvangin Earth-a temperature nunna awm theih tawkah a pui.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-076","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Carbon footprint means –","optionA":"Carbon dioxide emissions by a Coal industry","optionB":"Total sets of Carbon gas emissions caused by an organization, event, or a person","optionC":"Total sets of greenhouse gas emissions caused by an organization, event, or a person","optionD":"Carbon dioxide emissions by humans","correctAnswer":"C","subject":"Environment","topic":"Carbon Footprint","difficulty":"Medium","explanationEnglish":"A carbon footprint is the total greenhouse-gas emissions associated with an organization, event or person.","explanationMizo":"Carbon footprint tih chu mi mal, pawl, organization emaw thil siamchhuah pakhatin a tihchhuah greenhouse gas zawng zawngte zat pum pui chhutna a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-077","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The metallic element present in haemoglobin is –","optionA":"magnesium","optionB":"sodium","optionC":"iron","optionD":"zinc","correctAnswer":"C","subject":"Science","topic":"Human Biology","difficulty":"Easy","explanationEnglish":"Iron is the metallic element in haemoglobin.","explanationMizo":"Thisen sen (Haemoglobin)-in taksa puma oxygen a sem kual theih nana thir (Iron/Fe) hi a laipui bera tel a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: C."},
 {"id":"MCS21-P1-078","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The hormone that causes ripening of fruits is –","optionA":"ethylene","optionB":"methane","optionC":"helium","optionD":"carbon dioxide","correctAnswer":"A","subject":"Science","topic":"Plant Hormones","difficulty":"Easy","explanationEnglish":"Ethylene is the plant hormone that promotes fruit ripening.","explanationMizo":"Thei hmin tir theitu leh hmin chak tirtu plant hormone pawimawh ber chu Ethylene a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-079","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The plastic used for making bullet proof glass is –","optionA":"polystyrene","optionB":"polycarbonate","optionC":"polypropylene","optionD":"polyethylene","correctAnswer":"B","subject":"Science","topic":"Polymers","difficulty":"Medium","explanationEnglish":"Polycarbonate is used in bullet-resistant/bullet-proof glazing because of its impact resistance.","explanationMizo":"Polycarbonate hi plastic chak leh impact-resistant tak a nih avangin bulletproof glass siam nan hman a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: B."},
 {"id":"MCS21-P1-080","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"A nitrogenous base that is absent in DNA is –","optionA":"adenine","optionB":"guanine","optionC":"cytosine","optionD":"uracil","correctAnswer":"D","subject":"Science","topic":"Genetics","difficulty":"Easy","explanationEnglish":"Uracil occurs in RNA rather than DNA, where thymine is used instead.","explanationMizo":"DNA-ah chuan nitrogen base pali—Adenine, Thymine, Guanine, leh Cytosine te an awm a; Uracil erawh RNA-ah chauh a awm thung.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: D."},
 {"id":"MCS21-P1-081","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The reactions taking place in stars making them shine is –","optionA":"nuclear fusion","optionB":"nuclear fission","optionC":"neutron emission","optionD":"gamma decay","correctAnswer":"A","subject":"Science","topic":"Nuclear Physics","difficulty":"Easy","explanationEnglish":"Stars shine primarily through nuclear fusion reactions in their cores.","explanationMizo":"Arsi leh Ni chhunga hydrogen nuclei-te inhmehkhawmin helium an siam a, chutah chuan energy nasa tak a chhuak. He process hi nuclear fusion a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-082","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"Which of the following gases is the major constituent of natural gas?","optionA":"methane","optionB":"ethane","optionC":"propane","optionD":"butane","correctAnswer":"A","subject":"Science","topic":"Natural Gas","difficulty":"Easy","explanationEnglish":"Methane is the major component of natural gas.","explanationMizo":"Natural gas-a component tam ber chu Methane (CH₄) a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},
 {"id":"MCS21-P1-083","exam":"MCS Combined","year":2021,"type":"pyq","source":PYQ_SOURCE_P1,"verified":true,"question":"The red shift of light from distant galaxies provides evidence that the universe is –","optionA":"expanding","optionB":"shrinking","optionC":"expanding and shrinking in a cyclic pattern","optionD":"in steady state","correctAnswer":"A","subject":"Science","topic":"Astronomy","difficulty":"Easy","explanationEnglish":"The observed red shift of distant galaxies provides evidence that the universe is expanding.","explanationMizo":"Arsi leh galaxy hla tak takte atanga eng lo kal red shift-a an lanna hian chu'ng arsite chu kan hnen atangin an inthiarfihlim zel tih a lantir a; hei hian khawvel (universe) hi a zau tual tual (expanding) tih a tichiang a ni.","explanationStatus":"draft","mizoExplanationStatus":"checked","keyTakeaway":"Official MPSC final key: A."},

/* ---------- loader: checks every row, skips bad ones ---------- */
const LOAD_ERRORS=[],STAGED=[];
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* Subject grouping for the cards, filter and progress: the question rows keep their own subject text */
const SUBJECT_ALIAS={"Polity":"Indian Polity","History":"History & National Movement","Economy":"Economy & Social Development"};
const QUESTIONS=(()=>{const seen=new Set(),out=[],L='ABCD';
 QUESTION_BANK.forEach((r,n)=>{const bad=[],id=String(r.id),py=r.type==='pyq';
  if(py&&r.verified!==true){STAGED.push(id);return}
  if(r.id===undefined||seen.has(id))bad.push('missing or duplicate id');
  ['question','optionA','optionB','optionC','optionD','source'].concat(py?[]:['explanationEnglish','subject','topic']).forEach(k=>{if(!String(r[k]||'').trim())bad.push('missing '+k)});
  ['subject','topic','exam'].forEach(k=>{if(String(r[k]||'').includes('<'))bad.push(k+' contains <')});
  if(L.indexOf(r.correctAnswer)<0)bad.push('correctAnswer must be A, B, C or D');
  else if(ANSWER_KEY[id]&&ANSWER_KEY[id]!==r.correctAnswer)bad.push('correctAnswer does not match the official answer key');
  const lv=r.difficulty||(py?'Unrated':'');
  if(!['Easy','Medium','Hard'].concat(py?['Unrated']:[]).includes(lv))bad.push('difficulty must be Easy, Medium or Hard');
  if(!['sample','pyq'].includes(r.type))bad.push('type must be sample or pyq');
  if(py){if(!String(r.exam||'').trim())bad.push('pyq needs exam');if(!Number(r.year))bad.push('pyq needs year')}
  const stt=r.explanationStatus||(String(r.explanationEnglish||'').trim()?'draft':'missing');
  if(!['missing','draft','checked'].includes(stt))bad.push('explanationStatus must be missing, draft or checked');
  else if(stt!=='missing'&&!String(r.explanationEnglish||'').trim())bad.push('explanationStatus '+stt+' needs an English explanation');
  const mst=r.mizoExplanationStatus||(String(r.explanationMizo||'').trim()?'draft':'missing');
  if(!['missing','draft','checked'].includes(mst))bad.push('mizoExplanationStatus must be missing, draft or checked');
  else if(mst!=='missing'&&!String(r.explanationMizo||'').trim())bad.push('mizoExplanationStatus '+mst+' needs a Mizo explanation');
  if(bad.length){LOAD_ERRORS.push('Row '+(n+1)+' (id '+r.id+'): '+bad.join(', '));return}
  seen.add(id);
  out.push({id:id,src:r.type,exam:r.exam,year:r.year,subject:SUBJECT_ALIAS[r.subject]||r.subject||'Unclassified',topic:r.topic||'Unclassified',level:lv,
   passage:esc(r.passage||''),q:esc(r.question),o:[r.optionA,r.optionB,r.optionC,r.optionD].map(esc),a:L.indexOf(r.correctAnswer),
   e:esc(r.explanationEnglish||''),take:esc(r.keyTakeaway||''),status:stt,mstatus:mst,m:esc(r.explanationMizo||''),source:esc(r.source),verified:r.verified===true})});
 return out})();
if(LOAD_ERRORS.length)console.warn('Question bank problems:\n'+LOAD_ERRORS.join('\n'));
console.info('PYQ status: '+Object.keys(ANSWER_KEY).length+' answers on file, '+QUESTIONS.filter(q=>q.src==='pyq').length+' live, '+STAGED.length+' staged (not shown)');

try{P=JSON.parse(localStorage.getItem('mep1'))||P}catch(e){}
P.att=P.att||{};P.bm=(P.bm||[]).map(String);P.pref=Object.assign({daily:false,mock:true},P.pref||{});
const save=()=>{try{localStorage.setItem('mep1',JSON.stringify(P))}catch(e){}};

/* ---------- state ---------- */
let S={view:'home',mode:'practice',list:[],i:0,picked:{},mz:{},mock:null,F:{year:'',subject:'',topic:'',level:''}};
const $=id=>document.getElementById(id);
const uniq=a=>[...new Set(a)].sort();
const vpyq=()=>QUESTIONS.filter(q=>q.src==='pyq'&&q.verified===true);
const base=()=>S.mode==='pyq'?vpyq():QUESTIONS;
function apply(){const F=S.F;S.list=base().filter(x=>(!F.year||x.year==F.year)&&(!F.subject||x.subject==F.subject)&&(!F.topic||x.topic==F.topic)&&(!F.level||x.level==F.level));S.i=0}
function dailyList(){const d=new Date().toLocaleDateString('en-CA');let x=0;for(const c of d)x=(x*31+c.charCodeAt(0))>>>0;
 const r=()=>(x=(x*1664525+1013904223)>>>0)/4294967296;
 const pool=vpyq();if(pool.length<DAILY_MIN_PYQ)return [];
 return pool.map(q=>[r(),q]).sort((a,b)=>a[0]-b[0]).slice(0,10).map(t=>t[1])}
function go(v,m){stopTimer();S.view=v;if(m)S.mode=m;S.done=false;S.F={year:'',subject:'',topic:'',level:''};
 if(v==='start'){S.picked={};S.i=0;if(S.mode==='mock')startMock();else S.list=dailyList()}
 if(v==='quiz'){S.picked={};if(S.mode==='mock')startMock();else if(S.mode==='daily'){S.list=dailyList();S.i=0}else apply()}
 render();window.scrollTo(0,0)}
/* ---------- timer ---------- */
const TPQ={practice:60,daily:60,mock:90}; /* seconds allowed per question */
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function stopTimer(){if(S.timer&&S.timer.iv)clearInterval(S.timer.iv);S.timer=null}
function startTimer(total){stopTimer();S.timer={total:total,start:Date.now(),left:total,iv:setInterval(tick,1000),expired:false}}
function tick(){const t=S.timer;if(!t||!t.iv)return;t.left=Math.max(0,t.total-Math.floor((Date.now()-t.start)/1000));
 const a=$('tmr');if(a)a.textContent=fmt(t.left);const b=$('tbar');if(b)b.style.width=(t.left/t.total*100)+'%';
 const w=$('twrap');if(w)w.className='timer'+(t.left<=60?' low':'');if(t.left<=0)timeUp()}
function timeUp(){const t=S.timer;if(!t||!t.iv)return;t.expired=true;finish()}
function toggleTimer(){if(S.timer&&S.timer.iv)stopTimer();else if(S.list.length)startTimer(S.list.length*TPQ.practice);render()}
function setPref(m){P.pref[m]=!P.pref[m];save();render()}
function beginQuiz(){const m=S.mode;S.view='quiz';S.i=0;S.picked={};S.done=false;if(m==='mock')S.mock={ans:{},done:false};stopTimer();if(P.pref[m]&&S.list.length)startTimer(S.list.length*TPQ[m]);render();window.scrollTo(0,0)}
function openSubject(i){stopTimer();S.mode='practice';S.view='quiz';S.done=false;S.picked={};S.F={year:'',subject:i<0?'':S.names[i],topic:'',level:''};apply();render();window.scrollTo(0,0)}
function startMock(){const p=vpyq(),l=p.length<DAILY_MIN_PYQ?[]:[...p].sort(()=>Math.random()-.5).slice(0,10);S.mock={ans:{},done:false};S.list=l;S.i=0}
function setF(k,v){stopTimer();S.F[k]=v;if(k==='subject')S.F.topic='';apply();render()}
function pick(n){const q=S.list[S.i];
 if(S.mode==='mock'){if(!S.mock.done)S.mock.ans[q.id]=n}
 else if(S.picked[q.id]===undefined){S.picked[q.id]=n;P.att[q.id]={c:n===q.a};save()}
 render()}
function mv(d){S.i+=d;render();window.scrollTo(0,0)}
function toggleMz(id){S.mz[id]=!S.mz[id];render()}
function bm(id){const k=P.bm.indexOf(id);k<0?P.bm.push(id):P.bm.splice(k,1);save();render()}
function finish(){const t=S.timer;if(t&&t.iv){clearInterval(t.iv);t.iv=0;t.used=t.expired?t.total:Math.min(t.total,Math.floor((Date.now()-t.start)/1000))}S.done=true;if(S.mode==='mock'){S.mock.done=true;S.list.forEach(q=>{const a=S.mock.ans[q.id];if(a!==undefined)P.att[q.id]={c:a===q.a}});save()}render();window.scrollTo(0,0)}
function openBm(id){S.mode='practice';S.list=QUESTIONS.filter(x=>P.bm.includes(x.id));S.i=S.list.findIndex(x=>x.id===id);S.view='quiz';render();window.scrollTo(0,0)}
function reset(){if(confirm('Delete all progress and bookmarks on this device?')){P={att:{},bm:[],pref:P.pref};save();render()}}

<p class="foot">Not affiliated with the Mizoram Public Service Commission.</p>${LOAD_ERRORS.length?`<p class="foot" style="color:var(--bad)">${LOAD_ERRORS.length} question(s) skipped because of data errors. Ask Claude to check the question bank.</p>`:''}`}

function ctx(m){const ex=[...new Set(S.list.map(q=>q.exam+' '+q.year))].join(', ');
 return `<p class="legend">${m==='practice'?'<b>PYQ</b> = Previous Year Question · <b>SAMPLE</b> = Original practice question':m==='pyq'?'<b>PYQ</b> = Previous Year Question. Verified questions only.':'<b>PYQ</b> = Previous Year Question. Verified PYQs only'+(ex?' · '+ex:'')+'.'}</p>`}
function subjects(){const by={};QUESTIONS.forEach(q=>{const o=by[q.subject]=by[q.subject]||{n:0,py:0,sm:0};o.n++;if(q.src==='pyq')o.py++;else o.sm++});
 const names=Object.keys(by).sort((a,b)=>by[b].n-by[a].n||a.localeCompare(b));S.names=names;
 return topBar('MPSC/MCS Practice')+ctx('practice')+`<p class="sub">Tap a subject to start practising.</p><div class="subj"><button class="sc all" onclick="openSubject(-1)"><b>All subjects</b><span>${QUESTIONS.length} questions</span></button>`+
 names.map((s,i)=>{const o=by[s],tg=[o.py?o.py+' PYQ':'',o.sm?o.sm+' SAMPLE':''].filter(Boolean).join(' · ');return `<button class="sc" onclick="openSubject(${i})"><b>${s}</b><span>${o.n} question${o.n==1?'':'s'}</span><em>${tg}</em></button>`}).join('')+`</div>`}
function startScreen(){const m=S.mode,n=S.list.length,title=m==='mock'?'Mock Test':'Daily 10 Questions';let h=topBar(title)+ctx(m);
 if(!n)return h+`<div class="empty"><b>Coming soon.</b><br>This needs at least ${DAILY_MIN_PYQ} verified previous year questions.</div>`;
 const on=P.pref[m],mins=fmt(n*TPQ[m]);
 return h+`<div class="card"><p class="q">${n} questions</p><div class="tgl"><div><b>Timer</b><br><small>${on?mins+' minutes. The quiz is submitted automatically when time runs out.':'No time limit.'}</small></div><button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" onclick="setPref('${m}')">${on?'ON':'OFF'}</button></div></div><div class="nav"><button class="btn p" onclick="beginQuiz()">Start quiz</button></div>`}
function timerBar(){const t=S.timer,m=S.mode;if(S.done)return '';
 if(t&&t.iv)return `<div class="timer${t.left<=60?' low':''}" id="twrap"><div class="trow"><span>⏱ Time left</span><b id="tmr">${fmt(t.left)}</b>${m==='practice'?'<button class="tx" onclick="toggleTimer()">Stop timer</button>':''}</div><div class="tbar"><div id="tbar" style="width:${t.left/t.total*100}%"></div></div></div>`;
 if(m==='practice'&&S.list.length)return `<div class="timer off"><div class="trow"><span>⏱ Timer off</span><button class="tx" onclick="toggleTimer()">Turn on · ${S.list.length*TPQ.practice/60} min</button></div></div>`;
 return ''}
function timeStat(){const t=S.timer;if(!t||t.used===undefined)return '';return `<div class="stat" style="grid-column:1/-1"><b>${fmt(t.used)}</b><span>Time used, out of ${fmt(t.total)}${t.expired?'. Time was up, so the quiz was submitted automatically.':''}</span></div>`}
function sel(k,label,opts){return `<label>${label}<select onchange="setF('${k}',this.value)"><option value="">All</option>${opts.map(o=>`<option ${S.F[k]==o?'selected':''}>${o}</option>`).join('')}</select></label>`}

function quiz(){
 const mode=S.mode,mock=mode==='mock',title={practice:S.F.subject||'Practice',pyq:'Previous Year Questions',mock:'Mock Test',daily:'Daily 10 Questions'}[mode];
 if(S.done)return result(title);
 const b=base();let h=topBar(title,'',mode==='practice'?'subjects':'home')+ctx(mode)+timerBar();
 if((mode==='practice'||mode==='pyq')&&b.length){const sub=S.F.subject,topics=uniq(b.filter(x=>!sub||x.subject==sub).map(x=>x.topic));
  h+=`<details ${S.fopen?'open':''} ontoggle="S.fopen=this.open"><summary>Advanced Filters</summary><div class="fgrid">${sel('year','Year',uniq(b.map(x=>x.year)))}${sel('subject','Subject',uniq(b.map(x=>x.subject)))}${sel('topic','Topic',topics)}${sel('level','Difficulty',['Easy','Medium','Hard'].concat(b.some(x=>x.level==='Unrated')?['Unrated']:[]))}</div></details>`}
 if(!b.length)return h+`<div class="empty"><b>Previous Year Questions: coming soon</b><br>No real papers are loaded yet. Only papers we have permission to use will be added.</div>`;
 if(!S.list.length)return h+`<div class="empty">${mode==='mock'||mode==='daily'?'<b>Coming soon.</b><br>This needs at least '+DAILY_MIN_PYQ+' verified previous year questions.':'No questions match these filters. Change a filter to see more.'}</div>`;
 const q=S.list[S.i],n=S.list.length,ch=mock?S.mock.ans[q.id]:S.picked[q.id],done=!mock&&ch!==undefined,L='ABCD',last=S.i===n-1;
 h+=`<div class="prog"><span class="qno">Question ${S.i+1} of ${n}</span><span>${mock?Object.keys(S.mock.ans).length+' answered':Math.round((S.i+1)/n*100)+'%'}</span></div><div class="pbar"><div style="width:${(S.i+1)/n*100}%"></div></div>
 <div class="card ${q.src==='pyq'?'pyq':'smp'}"><div class="chips">${q.src==='pyq'?`<span class="chip p">PYQ · ${q.exam} ${q.year}</span><span class="chip">✓ Verified</span>`:`<span class="chip s">SAMPLE · not official</span>`}${q.subject==='Unclassified'?'':`<span class="chip">${q.subject}</span>`}${q.src==='pyq'?'':`<span class="chip">Year ${q.year}</span>`}${q.level==='Unrated'?'':`<span class="chip">${q.level}</span>`}${mock||done?'':`<button class="bm ${P.bm.includes(q.id)?'on':''}" onclick="bm('${q.id}')">${P.bm.includes(q.id)?'★ Saved':'☆ Save'}</button>`}</div>
 ${q.passage?`<details class="psg" open><summary>Read the passage</summary><div class="ptxt">${q.passage}</div></details>`:''}<p class="q">${q.q}</p>`;
 q.o.forEach((o,k)=>{let c='opt';if(done)c+=k===q.a?' ok':k===ch?' bad':'';else if(mock&&ch===k)c+=' pk';
  h+=`<button class="${c}" ${done?'disabled':''} onclick="pick(${k})"><i>${L[k]}</i><span>${o}</span></button>`});
 if(done){const ok=ch===q.a;
  h+=`<div class="ban ${ok?'ok':'bad'}">${ok?'✓ Correct':'✗ Incorrect'}<small>${ok?'Well done.':`Your answer: ${L[ch]}. Correct answer: ${L[q.a]}. ${q.o[q.a]}`}</small></div>
  ${q.e?`<div class="exp"><h4>Why?</h4>${q.e}</div>`:`<p class="srcline">Explanation coming soon.</p>`}
  ${q.m?`<button class="sec" onclick="toggleMz('${q.id}')">${S.mz[q.id]?'Hide Mizo explanation':'Explain in Mizo'}</button>`:''}
  ${q.m&&S.mz[q.id]?`<div class="mz"><h4>Mizo explanation</h4>${q.m}</div>`:''}
  ${q.take?`<div class="take"><h4>Key takeaway</h4>${q.take}</div>`:''}
  <button class="sec bmk ${P.bm.includes(q.id)?'on':''}" onclick="bm('${q.id}')">${P.bm.includes(q.id)?'★ Saved to bookmarks':'☆ Save question'}</button>
  ${q.src==='pyq'?`<p class="srcline">Source: ${q.source}</p>`:''}`}
 h+=`</div><div class="nav"><button class="btn" ${S.i===0?'disabled':''} onclick="mv(-1)">Previous Question</button>`;
 h+=(last&&(mode!=='practice'||(S.timer&&S.timer.iv)))?`<button class="btn p" onclick="finish()">Finish</button>`:`<button class="btn p" ${last?'disabled':''} onclick="mv(1)">Next Question</button>`;
 return h+`</div>`}

function result(title){const mock=S.mode==='mock',get=id=>mock?S.mock.ans[id]:S.picked[id],l=S.list,c=l.filter(q=>get(q.id)===q.a).length;
 return topBar(title+' result')+ctx(S.mode)+`<div class="stats"><div class="stat"><b>${c} / ${l.length}</b><span>Score</span></div><div class="stat"><b>${Math.round(c/l.length*100)}%</b><span>Accuracy</span></div>${timeStat()}</div>`+
 l.map(q=>{const a=get(q.id),ok=a===q.a;return `<div class="bmrow"><b style="color:var(--${ok?'ok':'bad'})">${a===undefined?'–':ok?'✓':'✗'}</b> ${q.q}<br><small>Answer: ${q.o[q.a]}</small></div>`}).join('')+
 `<div class="nav"><button class="btn" onclick="go('home')">Home</button>${mock?`<button class="btn p" onclick="go('start','mock')">Try another</button>`:''}${S.mode==='practice'?`<button class="btn p" onclick="go('subjects')">More subjects</button>`:''}</div>`}

function progress(){
 const ids=Object.keys(P.att),n=ids.length,c=ids.filter(k=>P.att[k].c).length,acc=n?Math.round(c/n*100):0;
 const bySub={};ids.forEach(k=>{const q=QUESTIONS.find(x=>x.id==k);if(!q)return;const s=bySub[q.subject]=bySub[q.subject]||{t:0,c:0};s.t++;if(P.att[k].c)s.c++});
 const rows=Object.entries(bySub).map(([s,v])=>({s,t:v.t,p:Math.round(v.c/v.t*100)})).sort((a,b)=>a.p-b.p);
 const weak=rows[0],best=rows[rows.length-1],bms=QUESTIONS.filter(x=>P.bm.includes(x.id));
 const sc=(t,v,col)=>`<div class="stat"><span>${t}</span><b style="${col?'color:var(--'+col+')':''}">${v}</b></div>`;
 const sj=(t,r)=>`<div class="stat"><span>${t}</span><b style="font-size:19px;line-height:1.3">${r?r.s:'–'}</b><span>${r?r.p+'% correct':'No data yet'}</span></div>`;
 let h=topBar('My Progress')+`<div class="stats">${sc('Total attempted',n)}${sc('Correct',c,'ok')}${sc('Wrong',n-c,'bad')}${sc('Accuracy',acc+'%')}</div><div class="two">${sj('Best subject',best)}${sj('Weakest subject',weak)}</div>`;
 h+=`<h3>Accuracy by subject</h3>`;
 h+=rows.length?rows.map(r=>`<div class="row"><span>${r.s}</span><span>${r.p}% of ${r.t}</span></div><div class="bar ${r.p<60?'w':''}"><div style="width:${r.p}%"></div></div>`).join('')+'<small style="color:var(--mute)">Red bars are below 60%. Practise these first.</small>':`<div class="empty">Answer a few practice questions and your results will show here.</div>`;
 h+=`<h3>Bookmarked questions (${bms.length})</h3>`;
 h+=bms.length?bms.map(q=>`<button class="bmrow" onclick="openBm('${q.id}')">${q.q}<br><small style="color:var(--mute)">${q.src==='pyq'?'PYQ · '+q.exam+' '+q.year:'SAMPLE · '+q.subject+' · '+q.topic}</small></button>`).join(''):`<div class="empty">Tap Save on any question to keep it here.</div>`;
 return h+`<button class="lnk" onclick="reset()">Reset my progress</button>`}

function render(){$('app').innerHTML=S.view==='home'?home():S.view==='progress'?progress():S.view==='subjects'?subjects():S.view==='start'?startScreen():quiz()}
render();
</script>
</body>
</html>
