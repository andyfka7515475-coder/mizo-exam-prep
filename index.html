button,select{font:inherit;color:inherit}

.opt i{font-style:normal;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px}

.exp h4{color:var(--green)}
.mz{background:var(--mz);border:2px solid var(--red);border-radius:12px;padding:12px;margin-top:10px;font-size:17px}
.mz h4{color:var(--red)}

.sec{background:none;border:2px solid var(--green);color:var(--green);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;margin-top:4px}
.nav{display:flex;gap:12px;margin-top:16px}

const PSG_1_3 = "Direction for Question Nos. 1 – 3 : Read the following passage carefully and choose the best answer to each of the questions out of the four alternatives:\n\nIn the 16th century, an age of great marine and terrestrial exploration, Ferdinand Magellan led the first expedition to sail around the world. As a young Portuguese noble, he served the king of Portugal, but he became involved in the quagmire of political intrigue at court and lost the king’s favor. After he was dismissed from service by the king of Portugal, he offered to serve the future Emperor Charles V of Spain.\n\nA papal decree of 1493 had assigned all land in the New World west of 50 degrees W longitude to Spain and all the land east of that line to Portugal. Magellan offered to prove that the East Indies fell under Spanish authority. On September 20, 1519, Magellan set sail from Spain with five ships. More than a year later, one of these ships was exploring the topography of South America in search of a water route across the continent. This ship sank, but the remaining four ships searched along the southern peninsula of South America. Finally they found the passage they sought near 50 degrees S latitude. Magellan named this passage the Strait of All Saints, but today it is known as the Strait of Magellan.\n\nOne ship deserted while in this passage and returned to Spain, so fewer sailors were privileged to gaze at that first panorama of the Pacific Ocean. Those who remained crossed the meridian now known as the International Date Line in the early spring of 1521 after 98 days on the Pacific Ocean. During those long days at sea, many of Magellan’s men died of starvation and disease.\n\nLater, Magellan became involved in an insular conflict in the Philippines and was killed in a tribal battle. Only one ship and 17 sailors under the command of the Basque navigator Elcano survived to complete the westward journey to Spain and thus prove once and for all that the world is round, with no precipice at the edge.";
const PSG_4_7 = "Direction for Question Nos. 4 – 7 : Read the following passage carefully and choose the best answer to each of the questions out of the four alternatives:\n\nThe Trojan War is one of the most famous wars in history. It is well known for the 10-year duration, for the heroism of a number of legendary characters, and for the Trojan horse. What may not be familiar, however, is the story of how the war began.\n\nAccording to Greek myth, the strife between the Trojans and the Greeks started at the wedding of Peleus, King of Thessaly, and Thetis, a sea nymph. All of the gods and goddesses had been invited to the wedding celebration in Troy except Eris, goddess of discord. She had been omitted from the guest list because her presence always embroiled mortals and immortals alike in conflict.\n\nTo take revenge on those who had slighted her, Eris decided to cause a skirmish. Into the middle of the banquet hall, she threw a golden apple marked “for the most beautiful.” All of the goddesses began to haggle over who should possess it. The gods and goddesses reached a stalemate when the choice was narrowed to Hera, Athena, and Aphrodite. Someone was needed to settle the controversy by picking a winner. The job eventually fell to Paris, son of King Priam of Troy, who was said to be a good judge of beauty. Paris did not have an easy job. Each goddess, eager to win the golden apple, tried aggressively to bribe him. “I’ll grant you vast kingdoms to rule,” promised Hera. “Vast kingdoms are nothing in comparison with my gift,” contradicted Athena. “Choose me and I’ll see that you win victory and fame in war.” Aphrodite outdid her adversaries, however. She won the golden apple by offering Helen, daughter of Zeus and the most beautiful mortal in the land, to Paris. Paris, anxious to claim Helen, set off for Sparta in Greece. Although Paris learned that Helen was married, he nevertheless accepted the hospitality of her husband, King Menelaus of Sparta. Therefore, Menelaus was outraged for a number of reasons when Paris departed, taking Helen and much of the king’s wealth back to Troy. Menelaus collected his loyal forces and set sail for Troy to begin the war to reclaim Helen.";
const PSG_8_11 = "Direction for Question Nos. 8 – 11 : Read the following passage carefully and choose the best answer to each of the questions out of the four alternatives:\n\nTrue, it is the function of the army to maintain law and order in abnormal times. But in normal times there is another force that compels citizens to obey the laws and to act with due regard to the rights of others. The force also protects the lives and the properties of law- abiding men. Laws are made to secure the personal safety of its subjects and to prevent murder and crimes of violence. They are made to secure the property of the citizens against theft and damage, to protect the rights of communities and castes to carry out their customs and ceremonies, so long as they do not conflict with the rights of others.\n\nNow the good citizen, of his own free will obey these laws and he takes care that everything he does is done with due regard to the rights and well-being of others. But the bad citizen is only restrained from breaking these laws by fear of the consequence of his actions. And the necessary steps to compel the bad citizen to act as a good citizen are taken by this force. The supreme control of law and order in a State is in the hands of a Minister who is responsible to the State Assembly and acts through the Inspector General of Police.";
const PSG_12_15 = "Direction for Question Nos. 12 – 15 : Read the following passage carefully and choose the best answer to each of the questions out of the four alternatives:\n\nA close look at the facts relating to political interference in administration shows that it is not a one-way process. There is often a nexus between power-hungry and corrupt politicians and civil servants with convenient principles. Many civil servants are only too anxious to oblige the politicians, and then cash the obligation when they need some special favour. So the attitude of self-righteousness adopted by the civil service is sometimes only a way of covering their own flaws by blaming others.\n\nEvery now and then some retired civil servants come out with his memoirs, painting a glorious picture of the heights of administrative efficiency reached during his reign. There is often the suggestion that had there not been so much political interference, things would have been even more fantastic. It is not unusual for the self-styled hero to blame not only interfering politicians but also fellow civil servants who were idiots or crooks, for his failures. This attitude of smug self-satisfaction is, unfortunately, developed during the years of service. Self-preservation rather than service is encouraged by our whole system of rules and procedures.\n\nThe remedy has to be drastic and quickly effective. The over-protection now granted to civil servants must end. Today to remove an erring civil servant is just not possible. And the only thing that the highest authority in the Government, both in the State and at the Centre, can do is to transfer an official from one job to another.\n\nThe rules for taking disciplinary action are so complicated that, in the end, the defaulting civil servant gets away, and gets his full emoluments even for the period of the disciplinary proceedings, thus making it a paid holiday for him.\n\nThe result is that the administration has become rule-oriented and not result-oriented. Action is possible against the official who takes some interest in his work, but no action is ever taken against a person who does not deliver the goods. If the country is to adopt a result-oriented approach, it is necessary to link job performance with job retention.";

 {"id":2,"exam":"Sample","year":2023,"subject":"Polity","topic":"Constitution","difficulty":"Easy","type":"sample","question":"Who was the Chairman of the Drafting Committee of the Indian Constitution?","optionA":"Jawaharlal Nehru","optionB":"B. R. Ambedkar","optionC":"Rajendra Prasad","optionD":"Sardar Patel","correctAnswer":"B","explanationEnglish":"Dr B. R. Ambedkar chaired the Drafting Committee, so he is called the Father of the Indian Constitution.","explanationMizo":"Dr B. R. Ambedkar hi Drafting Committee Chairman a ni, chuvangin Indian Constitution Pa tiin an ko.","source":"Original sample written for this app","verified":false},
 {"id":3,"exam":"Sample","year":2024,"subject":"Polity","topic":"Parliament","difficulty":"Medium","type":"sample","question":"What is the minimum age to contest a Lok Sabha election?","optionA":"18 years","optionB":"21 years","optionC":"25 years","optionD":"30 years","correctAnswer":"C","explanationEnglish":"A candidate for the Lok Sabha must be at least 25 years old. For the Rajya Sabha it is 30.","explanationMizo":"Lok Sabha thlanga ding tur chu kum 25 tal a nih a ngai. Rajya Sabha atan kum 30 a ni.","source":"Original sample written for this app","verified":false},
 {"id":4,"exam":"Sample","year":2024,"subject":"Polity","topic":"Tribal Administration","difficulty":"Medium","type":"sample","question":"The Sixth Schedule deals with the administration of tribal areas in which group of states?","optionA":"Assam, Meghalaya, Tripura, Mizoram","optionB":"Bihar, Odisha, Jharkhand, Mizoram","optionC":"Assam, Manipur, Nagaland, Sikkim","optionD":"Tripura, Bengal, Assam, Bihar","correctAnswer":"A","explanationEnglish":"The Sixth Schedule provides for Autonomous District Councils in the tribal areas of Assam, Meghalaya, Tripura and Mizoram.","explanationMizo":"Sixth Schedule hian Assam, Meghalaya, Tripura leh Mizoram a hnam leh hmun thenkhat atan Autonomous District Council a siam.","source":"Original sample written for this app","verified":false},
 {"id":5,"exam":"Sample","year":2023,"subject":"History","topic":"Modern India","difficulty":"Easy","type":"sample","question":"In which year was the Quit India Movement launched?","optionA":"1930","optionB":"1942","optionC":"1947","optionD":"1919","correctAnswer":"B","explanationEnglish":"The Quit India Movement was launched by Mahatma Gandhi in August 1942.","explanationMizo":"Quit India Movement hi Mahatma Gandhi'n 1942 August-ah a tichhuak.","source":"Original sample written for this app","verified":false},
 {"id":6,"exam":"Sample","year":2024,"subject":"History","topic":"Ancient India","difficulty":"Easy","type":"sample","question":"Who founded the Maurya Empire?","optionA":"Ashoka","optionB":"Bindusara","optionC":"Chandragupta Maurya","optionD":"Harshavardhana","correctAnswer":"C","explanationEnglish":"Chandragupta Maurya founded the Maurya Empire around 321 BCE with help from Chanakya.","explanationMizo":"Chandragupta Maurya'n Maurya Empire a din a, Chanakya a ṭanpui.","source":"Original sample written for this app","verified":false},
 {"id":7,"exam":"Sample","year":2025,"subject":"Geography","topic":"Rivers","difficulty":"Medium","type":"sample","question":"Which is the longest river that flows within India?","optionA":"Brahmaputra","optionB":"Indus","optionC":"Ganga","optionD":"Godavari","correctAnswer":"C","explanationEnglish":"The Ganga is the longest river within India. The Brahmaputra and Indus both begin outside India.","explanationMizo":"India chhunga luang rii sei ber chu Ganga a ni. Brahmaputra leh Indus chu India pawna ata an chhuak.","source":"Original sample written for this app","verified":false},
 {"id":8,"exam":"Sample","year":2025,"subject":"Geography","topic":"Mizoram","difficulty":"Medium","type":"sample","question":"Which imaginary line passes through Mizoram?","optionA":"Equator","optionB":"Tropic of Cancer","optionC":"Tropic of Capricorn","optionD":"Prime Meridian","correctAnswer":"B","explanationEnglish":"The Tropic of Cancer (23.5° N) passes through Mizoram, as well as several other Indian states.","explanationMizo":"Tropic of Cancer (23.5° N) hi Mizoram leh India state dang tam tak a tlang kai.","source":"Original sample written for this app","verified":false},
 {"id":9,"exam":"Sample","year":2025,"subject":"Mizoram GK","topic":"Geography","difficulty":"Medium","type":"sample","question":"What is the highest peak in Mizoram?","optionA":"Reiek","optionB":"Phawngpui","optionC":"Lengteng","optionD":"Dampa","correctAnswer":"B","explanationEnglish":"Phawngpui, also called Blue Mountain, is the highest peak in Mizoram at about 2,157 metres.","explanationMizo":"Phawngpui (Blue Mountain) hi Mizoram tlang sang ber a ni a, a sang chu metre 2,157 vel a ni.","source":"Original sample written for this app","verified":false},
 {"id":10,"exam":"Sample","year":2024,"subject":"Mizoram GK","topic":"Modern History","difficulty":"Hard","type":"sample","question":"Who signed the 1986 Mizoram Peace Accord on behalf of the Mizo National Front?","optionA":"Zoramthanga","optionB":"Laldenga","optionC":"Lalthanhawla","optionD":"Brigadier Sailo","correctAnswer":"B","explanationEnglish":"Laldenga, the MNF leader, signed the 1986 Accord with the Government of India. Mizoram became a full state in 1987.","explanationMizo":"MNF hruaitu Laldenga'n 1986 Accord chu India Sorkar nen a hmanpui a. 1987-ah Mizoram chu state a ni.","source":"Original sample written for this app","verified":false},
 {"id":11,"exam":"Sample","year":2023,"subject":"Science","topic":"Physics","difficulty":"Easy","type":"sample","question":"What is the SI unit of force?","optionA":"Joule","optionB":"Watt","optionC":"Pascal","optionD":"Newton","correctAnswer":"D","explanationEnglish":"Force is measured in newtons (N). One newton is the force that gives 1 kg an acceleration of 1 m/s².","explanationMizo":"Force hi Newton (N) hmangin an ruat.","source":"Original sample written for this app","verified":false},
 {"id":12,"exam":"Sample","year":2024,"subject":"Science","topic":"Biology","difficulty":"Easy","type":"sample","question":"Which vitamin does the skin make when exposed to sunlight?","optionA":"Vitamin A","optionB":"Vitamin C","optionC":"Vitamin D","optionD":"Vitamin K","correctAnswer":"C","explanationEnglish":"Skin makes Vitamin D when exposed to sunlight (UV-B rays).","explanationMizo":"Ni vâr tlak hian taksa chuan Vitamin D a siam.","source":"Original sample written for this app","verified":false},
 {"id":13,"exam":"Sample","year":2025,"subject":"Economy","topic":"Banking","difficulty":"Medium","type":"sample","question":"What is the repo rate?","optionA":"Rate at which banks lend to the public","optionB":"Rate at which RBI lends short-term money to banks","optionC":"Rate at which RBI borrows from banks","optionD":"Tax rate on bank deposits","correctAnswer":"B","explanationEnglish":"Repo rate is the interest rate at which the RBI lends short-term funds to commercial banks. A higher repo rate makes loans costlier.","explanationMizo":"Repo rate chu RBI'n bank-te a hawh chhunga sum a lak hlawh a ni.","source":"Original sample written for this app","verified":false},

 {id:"MCS21-P2-001", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_1_3, question:"Magellan was dismissed from the King of Portugal because", optionA:"he wanted to explore the world", optionB:"he lost his favour", optionC:"he was old and unable to work", optionD:"he was a noble", correctAnswer:"B", explanationEnglish:"The passage says Magellan became tangled in political intrigue at the Portuguese court and lost the king's favour. He was dismissed after that. Nothing says he was too old or that being a noble was the reason.", explanationMizo:"Magellan chu Portugal lal chhunga politics buainaah a tel a, chuvangin lal duhsakna a hloh. Chumi hnuah Portugal lal chuan hnathawh ata a hnawtchhuak.", keyTakeaway:"Court intrigue made Magellan lose the Portuguese king's favour, so he was dismissed.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-002", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_1_3, question:"Magellan was killed in a tribal battle after becoming involved _________ in the Phillipines.", optionA:"with thieves", optionB:"with crooked sailors", optionC:"in a dispute", optionD:"in a love triangle", correctAnswer:"C", explanationEnglish:"The passage says Magellan became involved in a conflict in the Philippines and was killed in a tribal battle. 'Conflict' means a dispute. Thieves, crooked sailors and a love triangle are never mentioned.", explanationMizo:"Passage-in a sawi dan chuan Magellan chu Philippines-ah inhnialna (conflict) ah a tel a, hnamte indonaah that a ni. 'Conflict' chu 'dispute' (inhnialna) tihna a ni. Rukru, lawng hnathawktu mi dik lo, hmangaihna inkâr (love triangle) te chu passage-in a sawi lo.", keyTakeaway:"Conflict = dispute.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-003", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Vocabulary", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_1_3, question:"the word ‘precipice’ means", optionA:"dangerous", optionB:"stormy weather", optionC:"mountain ranges", optionD:"steep cliff", correctAnswer:"D", explanationEnglish:"A precipice is a very steep rock face or cliff. The passage ends by saying the voyage proved the world is round, with no cliff at its edge to fall from.", explanationMizo:"“Precipice” chu tlângpui emaw lungpui emaw a thuk tak leh tlâk hlauhawm tihna a ni. Passage-in Magellan-te khualzin chuan lei hi kulhvel a ni tih leh lei tâwpah precipice a awm lo tih a lantîr.", keyTakeaway:"Precipice = steep cliff.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-004", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_4_7, question:"The story of how the Trojan War started is not very", optionA:"Clear", optionB:"Well- known", optionC:"Violent", optionD:"Obscure", correctAnswer:"B", explanationEnglish:"The passage says the story of how the war began may not be familiar, so it is not very well known. 'Obscure' would make the sentence mean the opposite, because 'not very obscure' means fairly well known.", explanationMizo:"Passage hian Trojan War chanchin chu mi tam takin an hre lo tih a sawi. Chuvangin “not very well-known” tih chu “mi tam takin an hre lo” tihna a ni.", keyTakeaway:"'May not be familiar' means 'not very well known'.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-005", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Vocabulary", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_4_7, question:"The word ‘skirmish’ means", optionA:"Fight", optionB:"Quarrel", optionC:"Dancing", optionD:"Gossip", correctAnswer:"A", explanationEnglish:"A skirmish is a short, minor fight or clash. Eris wanted to cause trouble at the wedding, and the goddesses began to fight over the apple. A quarrel is a verbal argument, so 'Fight' is the closest meaning.", explanationMizo:"“Skirmish” chu inbeihna tê, rei lo emaw short fight tihna a ni. Passage-ah “skirmish” hi inbeihna tê emaw fight tih awmzia a hman a ni. Chuvangin “Fight” hi a awmzia hnênah ber chu a ni.", keyTakeaway:"Skirmish = a small fight or clash.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-006", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_4_7, question:"Athena _________ Hera, promising Paris victory and fame in war.", optionA:"opposed", optionB:"defeated", optionC:"agreed with", optionD:"confused", correctAnswer:"A", explanationEnglish:"Hera offered Paris kingdoms, but Athena said kingdoms were nothing compared with her gift of victory and fame. She contradicted and competed against Hera, so she 'opposed' her.", explanationMizo:"Hera chuan Paris hnenah ram lian tak pek a tiam a, Athena chuan 'ram lian hi engmah a ni lo' a ti a, a pek tur hnehna leh hming ropui a sawi. Athena chuan Hera thu a dodal a, chuvangin 'opposed' a ni.", keyTakeaway:"To contradict someone's offer is to oppose it.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-007", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Vocabulary", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_4_7, question:"The word closest in meaning to “stalemate” is", optionA:"When neither side has an advantage", optionB:"When one side uses trickery to gain advantage", optionC:"Committing adultery", optionD:"Committing theft", correctAnswer:"A", explanationEnglish:"A stalemate is a deadlock where neither side can gain an advantage. In the passage the goddesses reached one when the choice narrowed to Hera, Athena and Aphrodite and nobody would give way.", explanationMizo:"“Stalemate” chu pakhat pawhin hnehna an neih loh, tumah an inpe lohna dinhmun tihna a ni. Hei hi mi pahnih emaw, mi pahnih aia tam emaw inkahnaah pakhat pawhin hnehna an neih loh hunah a thleng thei.", keyTakeaway:"Stalemate = deadlock, with no side ahead.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-008", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_8_11, question:"Which of the following is not implied in the passage?", optionA:"Law protects those who respect it", optionB:"Law ensures people’s religious and social rights absolutely and unconditionally", optionC:"A criminal is deterred from committing crimes only for fear of the law", optionD:"The forces of law help to transform irresponsible citizens into responsible ones", correctAnswer:"B", explanationEnglish:"The passage says communities may follow their customs and ceremonies only 'so long as they do not conflict with the rights of others'. So those rights are conditional, not 'absolute and unconditional'. The other three statements are supported by the passage.", explanationMizo:"Passage hian mihringte sakhaw leh khawtlang dikna te chu danin a humhim tih a sawi. Nimahsela, “absolutely and unconditionally” tih hi danin chu dikna te chu condition engmah awm lovin a humhim vek tihna a ni a, passage chuan chu ang taka a sawi lo.", keyTakeaway:"In 'not implied' questions, look for extreme words like 'absolutely' and 'unconditionally'.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-009", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_8_11, question:"According to the writer, which one of the following is not the responsibility of the police?", optionA:"To protect the privileges of all citizens", optionB:"To check violent activities of citizens", optionC:"To ensure peace among citizens by safeguarding individual rights", optionD:"To maintain peace during extraordinary circumstances", correctAnswer:"D", explanationEnglish:"The passage describes the army as responsible for maintaining law and order in abnormal times. It then describes another force operating in normal times and later identifies the Inspector General of Police as acting through that system. Therefore, maintaining peace in extraordinary circumstances is not presented as the police's responsibility.", explanationMizo:"Passage-in army chu abnormal times-ah dân leh remna (law and order) chelh tura a sawi. Chumi hnuah normal times-a thawk force dang a sawi a, a tâwp lamah Inspector General of Police chu chu system hmanga thawktu niin a sawi. Chuvangin extraordinary circumstances-ah remna chelh hi police-te tih tur atan passage-in a sawi lo.", keyTakeaway:"Abnormal times: army. Normal times: police.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-010", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Vocabulary", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_8_11, question:"Out of the following which one has the opposite meaning to the word ‘restraint’ in the passage?", optionA:"Promoted", optionB:"Accelerated", optionC:"Intruded", optionD:"Inhibited", correctAnswer:"B", explanationEnglish:"Restraint means holding back or limiting something. In the context of the passage, 'accelerated'—meaning made faster or increased in speed—represents movement in the opposite direction from holding something back. 'Inhibited' has a similar meaning to restraint, while 'intruded' and 'promoted' do not fit as well.", explanationMizo:"“Restraint” chu thil tihtawp emaw, thil tih dan khap emaw, thil kalpui tihzauh emaw tihna a ni. “Accelerated” chu thil kalpui rang zawk emaw, speed tihpun emaw tihna a ni. Chuvangin “accelerated” hi “restraint” nêna inkalh ber chu a ni.", keyTakeaway:"Restraint = holding back. Its opposite is speeding up.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-011", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_8_11, question:"The last sentence of the passage implies that", optionA:"The Inspector General of Police is the sole authority in matters of law and order", optionB:"In every State, maintenance of public peace is under the overall control of the responsible Minister", optionC:"A Minister and a responsible State Assembly exercise direct authority in matters pertaining to law and order", optionD:"The Inspector General of Police is responsible to the State Assembly for maintaining law and order", correctAnswer:"B", explanationEnglish:"The last sentence says the supreme control of law and order is in the hands of a Minister, who answers to the State Assembly and acts through the Inspector General of Police. So the Minister has overall control. The Inspector General is only the channel, not the sole authority.", explanationMizo:"Passage tâwp lam thu chuan dân leh remna chunga thuneitu chungnung ber chu Minister a ni a, State Assembly hnenah mawhphurtu a ni a, Inspector General of Police hmangin a thawk. Chuvangin Minister hian overall control a nei. Inspector General chu kawng (channel) chauh a ni a, thuneitu pakhat chauh (sole authority) a ni lo.", keyTakeaway:"The Minister controls law and order, answers to the Assembly, and acts through the IG of Police.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-012", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_12_15, question:"The existing system of administration seems to encourage civil servants", optionA:"to become self-styled heroes and boss over others", optionB:"to present a glorious picture of the administration", optionC:"to become self-centred and concerned mainly about their own gain", optionD:"to become self-righteous and fight back against corrupt politicians", correctAnswer:"C", explanationEnglish:"The passage says self-preservation rather than service is encouraged by the whole system of rules and procedures. That means civil servants are pushed to look after themselves and their own gain.", explanationMizo:"Passage-in a sawi dan chuan rules leh procedures system zawng zawng hian service aiin self-preservation (mahni humhim) a fuih. Chu chuan civil servant-te chu mahni humhim leh mahni hlawkna ngaihtuah zâwk turin a hruai. Chuvangin 'self-centred and concerned mainly about their own gain' a dik.", keyTakeaway:"The system rewards self-preservation, not service.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-013", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_12_15, question:"The problem with the present set-up needing urgent action is", optionA:"a lack of accountability on the part of civil servants", optionB:"a lack of control over the power of politicians", optionC:"a neglect of the ideals of self-righteousness", optionD:"complicated rules and procedures that greatly reduce efficiency", correctAnswer:"A", explanationEnglish:"The passage complains that civil servants are over-protected: an erring one cannot be removed and no action is taken against someone who does not deliver. Its remedy is to link job performance with job retention. That points to a lack of accountability.", explanationMizo:"Passage-a a sawi danin civil servant-te hna thawh dan leh an hna an la reng dan chungchangah accountability hi a tlem. Chuvangin civil servant-te hna thawh danah accountability tlem hi a buaina lian ber pakhat a ni.", keyTakeaway:"The core problem is no accountability: poor performance has no consequences.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-014", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_12_15, question:"According to existing procedures, if a civil servant is found to be unsuitable or dishonest,", optionA:"he can appeal to an authority like the Supreme Court", optionB:"politicians with whom he has special links will interfere to help him", optionC:"transferring him to another post is the usual action taken", optionD:"a conflict between Central Government and State Government can arise", correctAnswer:"C", explanationEnglish:"The passage says the only thing the highest authority can do about an erring civil servant is to transfer him from one job to another. So transfer is the usual action.", explanationMizo:"Passage-in a sawi dan chuan Sorkar hotute chuan civil servant thil dik lo titu hi hna dang-ah thlak (transfer) chauh an ti thei. Chuvangin 'transferring him to another post' hi hman ṭhin (usual action) a ni.", keyTakeaway:"Under present rules, an erring civil servant is only transferred.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-015", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Vocabulary", difficulty:"Medium", source:PYQ_SOURCE, verified:true, passage:PSG_12_15, question:"The expression ‘deliver the goods’ means", optionA:"show good job performance", optionB:"accept bribes or other illegal favours", optionC:"make payments of black money as bribes", optionD:"successfully defend oneself against a charge, in a disciplinary inquiry", correctAnswer:"A", explanationEnglish:"The passage contrasts officials who show interest in their work with those who 'do not deliver the goods', and wants job performance linked to job retention. So the expression means to perform well and produce results.", explanationMizo:"Passage-in hna thawk ṭha lo, 'deliver the goods' lo tu chungah hna ti a awm lo a sawi a, hna thawh dik hi hna la reng nen inzawm tur a ti. Chuvangin 'deliver the goods' chu hna ṭha taka thawk a, rah chhuah (result) pek tihna a ni.", keyTakeaway:"To deliver the goods is to produce the expected results.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-016", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_16_17, question:"Hummingbirds need a lot of energy in order to", optionA:"maintain their body metabolism", optionB:"flap their wings and fly backwards", optionC:"sustain a steady rhythm of heartbeat", optionD:"win in the struggle for survival", correctAnswer:"A", explanationEnglish:"The passage says hummingbirds need an incredible amount of energy to sustain their body metabolism. That is why they must eat so much nectar. Wing flapping and heartbeat are described as reasons they eat a lot, not as the stated purpose of the energy.", explanationMizo:"Hummingbird-te chuan an taksa metabolic activity kalpui turin energy tam tak an mamawh. Chuvangin nectar atangin energy an la a, chu energy chu an taksa function-te normal taka kalpui nan an hmang.", keyTakeaway:"Energy from nectar sustains the hummingbird's metabolism.", explanationStatus:"checked", mizoExplanationStatus:"checked"},
 {id:"MCS21-P2-017", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"English", topic:"Reading Comprehension", difficulty:"Easy", source:PYQ_SOURCE, verified:true, passage:PSG_16_17, question:"The hummingbirds are exclusive in the sense that", optionA:"they subsist only on nectar", optionB:"their pulse rate is more than 1000 per minute", optionC:"they consume half their body weight everyday", optionD:"they can fly backwards", correctAnswer:"D", explanationEnglish:"The passage says hummingbirds are the only birds that can fly backwards. 'Exclusive' means unique to them. The other options are facts about them but are not described as unique.", explanationMizo:"Passage-in hummingbird-te hi hnung lamah thlawh thei (fly backwards) bird chauh an ni a ti. 'Exclusive' chu an chauh (unique) tihna a ni. Dang options-te chu hummingbird-te chanchin ni mah se, an chauh a ni tih passage-in a sawi lo.", keyTakeaway:"Exclusive = only. Only hummingbirds fly backwards.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-018", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"Psychology & Communication", topic:"Self-awareness", difficulty:"Easy", source:PYQ_SOURCE, verified:true, question:"The capacity to understand oneself including thoughts, feelings, and behavior.", optionA:"Self-concept", optionB:"Self-awareness", optionC:"Self-esteem", optionD:"Self- confidence", correctAnswer:"B", explanationEnglish:"Self-awareness is the ability to understand yourself: your thoughts, feelings and behaviour. Self-concept is the picture you hold of yourself, self-esteem is how much you value yourself, and self-confidence is belief in your abilities.", explanationMizo:"Self-awareness chu mahni ngaihtuahna (thoughts), rilru (feelings) leh thiltih (behaviour) hriat thiam theihna a ni. Self-concept chu mahni lam thlir dan; self-esteem chu mahni ngaihhlutna; self-confidence chu mahni theihna rinna a ni.", keyTakeaway:"Self-awareness = understanding your own thoughts, feelings and behaviour.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-019", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"Psychology & Communication", topic:"Resilience", difficulty:"Easy", source:PYQ_SOURCE, verified:true, question:"The ability to bounce back from setbacks, to be successful again after something bad has happened.", optionA:"Victory", optionB:"Competence", optionC:"Resilience", optionD:"Confidence", correctAnswer:"C", explanationEnglish:"Resilience is the ability to bounce back after a setback and succeed again. Competence is skill, confidence is belief in yourself, and victory is winning.", explanationMizo:"Resilience chu harsatna (setback) tawh hnuah tho leh a, hlawhtling leh theihna (bounce back) a ni. Competence chu thiamna (skill), confidence chu mahni rinna, victory chu hnehna a ni.", keyTakeaway:"Resilience = bouncing back from setbacks.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
 {id:"MCS21-P2-020", exam:PYQ_EXAM, year:PYQ_YEAR, type:"pyq", subject:"Psychology & Communication", topic:"Effective Communication", difficulty:"Easy", source:PYQ_SOURCE, verified:true, question:"Effective communication emphasizes one’s ability to:", optionA:"Process information easily.", optionB:"Express oneself both verbally and non-verbally.", optionC:"Discuss strategies in solving problems effectively.", optionD:"Look beyond the direct experience and address issues in different perspectives.", correctAnswer:"B", explanationEnglish:"Effective communication means getting your message across clearly, through words (verbal) and also tone, gestures and body language (non-verbal). The other options describe thinking or problem solving, not communication itself.", explanationMizo:"Effective communication chu mahni thu leh message chu midangin an hriat thiam theih nan verbal leh non-verbal communication hmanga sawi thiamna a ni. Verbal communication-ah thu kan hmang a, non-verbal communication-ah tone, gestures leh body language kan hmang.", keyTakeaway:"Good communication uses both words and body language.", explanationStatus:"checked", mizoExplanationStatus:"draft"},
